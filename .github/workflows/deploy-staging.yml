name: Deploy one Edge Function to Staging (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fieldmind-staging-edge-function
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy approved function to Staging
    runs-on: ubuntu-latest
    environment:
      name: fieldmind-staging
    steps:
      - name: Checkout approved staging source
        uses: actions/checkout@v4
        with:
          ref: fieldmind-internal-screening-v1

      - name: Verify target and deployment scope
        shell: bash
        env:
          PROJECT_ID: ${{ secrets.SUPABASE_STAGING_PROJECT_ID }}
        run: |
          set -euo pipefail
          test "${PROJECT_ID}" = "qjmolklafyqwsvaasyhd" || {
            echo "Refusing deployment: Staging project ID is missing or incorrect."
            exit 1
          }
          test "${PROJECT_ID}" != "qgjdtxjsvauhtqaaebly" || {
            echo "Refusing deployment to Production."
            exit 1
          }
          test -f supabase/functions/fieldmind-submit-assessment/index.ts
          grep -Fq 'https://raeddwik.github.io' supabase/functions/fieldmind-submit-assessment/index.ts
          grep -Fq 'http://localhost:8001' supabase/functions/fieldmind-submit-assessment/index.ts

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy only fieldmind-submit-assessment
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ secrets.SUPABASE_STAGING_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}"
          supabase functions deploy fieldmind-submit-assessment --project-ref "${PROJECT_ID}" --use-api
