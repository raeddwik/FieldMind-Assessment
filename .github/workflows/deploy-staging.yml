name: Deploy one Edge Function to Staging (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fieldmind-staging-edge-function-deploy
  cancel-in-progress: false

jobs:
  deploy-staging-function:
    name: Deploy fieldmind-submit-assessment to Staging only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: fieldmind-staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_STAGING_PROJECT_ID }}
      EXPECTED_STAGING_PROJECT_ID: qjmolklafyqwsvaasyhd
      FORBIDDEN_PRODUCTION_PROJECT_ID: qgjdtxjsvauhtqaaebly

    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify required secrets and enforce Staging target
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN}" ]]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN repository secret."
            exit 1
          fi
          if [[ -z "${PROJECT_ID}" ]]; then
            echo "::error::Missing SUPABASE_STAGING_PROJECT_ID repository secret."
            exit 1
          fi
          if [[ "${PROJECT_ID}" == "${FORBIDDEN_PRODUCTION_PROJECT_ID}" ]]; then
            echo "::error::Refusing to target the Production project."
            exit 1
          fi
          if [[ "${PROJECT_ID}" != "${EXPECTED_STAGING_PROJECT_ID}" ]]; then
            echo "::error::Project ID does not match the approved Staging project. Refusing deployment."
            exit 1
          fi
          echo "Target verified: approved Staging project only."

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy only the submission Edge Function to Staging
        shell: bash
        run: |
          set -euo pipefail
          # Deliberately deploy one function only. No database commands, migrations,
          # secrets changes, pruning, or production target are permitted in this workflow.
          supabase functions deploy fieldmind-submit-assessment \
            --project-ref "${PROJECT_ID}" \
            --use-api
